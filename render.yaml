# LEGACY EPHEMERAL / NO-MODEL PROFILE ONLY. CP11 uses deploy/render-persistent.yaml.
# Deployment preparation only. No account, public URL or secret is configured.
# Keep AI disabled on an ephemeral free instance: budgets otherwise reset on restart.
services:
  - type: web
    name: finn-evidence-prototype
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers --no-access-log
    healthCheckPath: /health
    envVars:
      - key: AI_ENABLED
        value: "false"
      - key: REASONING_PROVIDER
        value: disabled
      - key: AI_BUDGET_STORAGE_PERSISTENT
        value: "false"
      - key: FINN_DB
        value: /tmp/finn.sqlite3
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: GEMINI_REASON_MODEL
        value: gemini-3.5-flash-lite
