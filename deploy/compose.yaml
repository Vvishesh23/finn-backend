# Existing owner-controlled host alternative. No cloud account is configured.
services:
  finn:
    build:
      context: ..
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FINN_DB: /var/data/finn.sqlite3
      AI_BUDGET_STORAGE_PERSISTENT: "true"
      AI_ENABLED: "false"
      REASONING_PROVIDER: disabled
    volumes:
      - finn_data:/var/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  finn_data:
